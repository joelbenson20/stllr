<button class="float-button display-6"
    data-webpage-id="{{ webpage.id }}" 
    {% if webpage.id in user.voted_webpages_ids %}data-voted="true"
    {% else %}data-voted="false"{% endif %}>
    <span class="float-count">{{ webpage.num_votes }}</span>
    <i class="fa-solid fa-circle"></i>
</button>
