<div class="feed">
    {% for webpage in webpages %}
        <div class="row m-5">

            <p class="m-0 p-0">
                {{ webpage.num_votes }} 
                <button data-webpage-id="{{ webpage.id }}"><i class="fa-solid fa-ghost" ></i></button>
            </p>
            <h1 class="display-6 m-0 p-0">{{ webpage.url }}</h1>

        </div>
    {% endfor %}
    <script>
        window.CSRF_TOKEN = '{{ csrf_token }}';
    </script>
</div>
