{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Float</title>

    <link rel="stylesheet" href="{% static 'libs/bootstrap/dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'libs/bootstrap-icons/font/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/comments.css' %}">
    <link rel="stylesheet" href="{% static 'css/webpages.css' %}">

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'brand/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'brand/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'brand/site.webmanifest' %}">

</head>

<body>

    <div id="window" class="container-fluid m-0 p-0">

        <nav class="navbar navbar-dark navbar-expand-sm sticky-top p-3">
            <a class="navbar-brand" href="{% url 'index' %}">
                <img class="navbar-brand-image" src="{% static 'brand/favicon-32x32.png' %}">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <!-- <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Home</a>
                    </li> -->
                </ul>
                {% if user.is_authenticated %}
                <span class="navbar-text ms-auto fst-italic">
                    Hello, @{{ user.username }}! 
                </span>
                <form class="d-flex ms-auto" method="post" action="{% url 'float_webpage' %}">
                    {% csrf_token %}
                    <input class="float-bar form-control form-control-md me-2" name="url" type="text" placeholder="Float a webpage..." required>
                    <!-- <button type="submit" class="btn btn-sm btn-primary">Float</button> -->
                </form>
                <form class="navbar-text ms-3" id="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-button btn btn-sm">Logout</button>
                </form>
                {% else %}
                <a id="sign-in-button" class="btn btn-sm ms-auto" href="{% url 'login' %}?next={{ request.path|urlencode }}">Sign in</a>
                {% endif %}
            </div>
        </nav>

        <div id="content" class="container-fluid p-sm-5 p-3">
        {% block content %}
            {% include 'webpage_feed.html' with webpages=webpages user=user %}
        {% endblock %}
        </div>

    </div>
    
    <script src="{% static 'libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/floatButtons.js' %}"></script>
    <script src="{% static 'js/commentsAPI.js' %}"></script>
    {% block scripts %}
    {% endblock %}
</body>

</html>
