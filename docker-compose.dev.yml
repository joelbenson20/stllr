name: stllr_dev

services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stllr_dev
      POSTGRES_USER: stllr_dev
      POSTGRES_PASSWORD: stllr_dev
    volumes:
      - ./data/db_dev:/var/lib/postgresql
    ports:
      - "5432:5432"

  cache:
    image: redis:8
    volumes:
      - ./data/cache_dev:/data
    ports:
      - "6379:6379"

  celery:
    build: .
    command: ["./wait-for-it.sh", "db:5432", "--",
              "bash", "-c", "cd /code/stllr && celery -A stllr worker --loglevel=info"]
    restart: always
    env_file:
      - ./stllr/.env
    environment:
      - POSTGRES_HOST=db
    volumes:
      - .:/code
    depends_on:
      - db
      - cache

  celery-beat:
    build: .
    command: ["./wait-for-it.sh", "db:5432", "--",
              "bash", "-c", "cd /code/stllr && celery -A stllr beat --loglevel=info"]
    restart: always
    env_file:
      - ./stllr/.env
    environment:
      - POSTGRES_HOST=db
    volumes:
      - .:/code
    depends_on:
      - db
      - cache
