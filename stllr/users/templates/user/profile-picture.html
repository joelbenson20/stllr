{% load static %}
{% load thumbnail %}

<a class="d-block position-relative rounded-circle overflow-hidden me-2 flex-shrink-0"
    href="{{ user.profile.get_absolute_url }}"
    style="width:{{size}}px;height:{{size}}px;flex-shrink:0;">
    {% if user.profile.background %}
        {% thumbnail user.profile.background dimensions crop="smart" as im %}
        <img class="position-absolute top-0 start-0 object-fit-cover" style="width:{{size}}px;height:{{size}}px;" src="{{ im.url }}">
    {% endif %}
    <img class="position-absolute top-0 start-0" style="width:{{size}}px;height:{{size}}px;" src="{% static 'brand/icon.png' %}">
</a>
