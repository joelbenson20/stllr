<div class="d-flex align-items-center">

    <a class="me-2 flex-shrink-0" href="{{ user.profile.get_absolute_url }}">
        {% include "user/avatar.html" with user=user size="40" dimensions="40x40" %}
    </a>

    <div class="d-flex align-items-center flex-wrap">
        <a class="post-user small text-secondary"
            href="{{ post.author.profile.get_absolute_url }}">
            @{{ user.username }}
        </a>
        <i class="bi bi-dot text-secondary"></i>
        <span class="small text-secondary">{{ timestamp }}</span>
    </div>

</div>
