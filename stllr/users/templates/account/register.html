{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Create an account{% endblock title %}

{% block content %}
    <h1>Create an account</h1>
    <form method="post">
        {% csrf_token %}
        {{ user_form|crispy }}
        <button class="btn btn-submit" type="submit" value="Create my account">Create my account</button>
    </form>
{% endblock content %}
