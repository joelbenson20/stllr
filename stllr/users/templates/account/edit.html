{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Edit your account{% endblock title %}

{% block content %}
    <h1>Edit your profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% crispy profile_form %}
        <button class="btn btn-submit" type="submit">Save profile</button>
    </form>
{% endblock content %}
