{% extends "base.html" %}
{% load i18n crispy_forms_tags socialaccount %}

{% block title %}sign in — stllr{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <h2 class="mb-4">Sign In</h2>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {{ form|crispy }}
            {{ redirect_field }}
            <div class="d-grid gap-2 mt-3">
                <button type="submit" class="btn btn-dark">Sign In</button>
            </div>
        </form>

        <div class="d-flex align-items-center my-3 text-secondary small">
            <hr class="flex-grow-1">
            <span class="mx-2">or</span>
            <hr class="flex-grow-1">
        </div>

        <div class="d-grid">
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13 17.8 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/>
                    <path fill="#FBBC05" d="M10.5 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A23.8 23.8 0 0 0 0 24c0 3.8.9 7.4 2.5 10.6l7.9-6z"/>
                    <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.9 6C6.6 42.6 14.6 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Sign in with Google
            </a>
        </div>

        <p class="mt-3 text-secondary small">
            Don't have an account?
            <a href="{% url 'account_signup' %}">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
