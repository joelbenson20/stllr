{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}edit your account - stllr{% endblock title %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% crispy user_form %}
        {% crispy profile_form %}
        <button class="btn btn-primary float-end" type="submit">Save profile</button>
    </form>
{% endblock content %}
