{% load static %}

{% if contacts_list %}
    {% regroup contacts_list by user.username.0|upper as alpha_groups %}
    {% for group in alpha_groups %}
    <div class="mb-2">
        <div class="text-muted small fw-bold px-1 pb-1 border-bottom border-secondary mb-1">{{ group.grouper }}</div>
        {% for item in group.list %}
        <div>
            <button class="btn btn-dark w-100 text-start d-flex align-items-center gap-3 py-2 px-2 rounded-3 border-0"
                    data-bs-toggle="collapse"
                    data-bs-target="#contact-{{ item.user.username }}"
                    aria-expanded="false">
                {% include "user/profile-picture.html" with user=item.user size="40" dimensions="40x40" %}
                <span class="fw-semibold">@{{ item.user.username }}</span>
                <i class="bi bi-chevron-down ms-auto text-muted small"></i>
            </button>
            <div class="collapse px-2 pb-2" id="contact-{{ item.user.username }}">
                <div class="d-flex gap-2 pt-1 ps-1">
                    <a href="{% url 'profile' item.user.username %}" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-person"></i> Profile
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
{% else %}
    <p class="text-secondary small">No contacts yet.</p>
{% endif %}
