<div class="crew-admittance-btns d-flex gap-2">
    {% if membership.status == 'active' %}
        <form method="post" action="{% url 'crews:remove_member' crew.handle membership.user.username %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="btn btn-sm btn-glass text-danger">
                Remove
            </button>
        </form>
    {% elif membership.status == 'requested' %}
        <form method="post" action="{% url 'crews:admit_member' crew.handle membership.user.username %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="btn btn-sm btn-glass">
                <i class="bi bi-check-lg me-1"></i>Admit
            </button>
        </form>
        <form method="post" action="{% url 'crews:deny_member' crew.handle membership.user.username %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="btn btn-sm btn-glass text-danger">
                <i class="bi bi-x-lg me-1"></i>Deny
            </button>
        </form>
    {% endif %}
</div>
