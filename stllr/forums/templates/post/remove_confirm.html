{% extends "base.html" %}

{% block title %}stllr | remove post{% endblock title %}

{% block content %}
<div class="d-flex flex-column align-items-start gap-4 mt-4">

    <div>
        <h5 class="text-danger mb-1"><i class="bi bi-x-square-fill me-2"></i>Remove post?</h5>
        <p class="text-secondary small mb-0">This action cannot be undone. Close this tab to cancel.</p>
    </div>

    {% include "post/card.html" %}

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Remove</button>
    </form>

</div>
{% endblock content %}
