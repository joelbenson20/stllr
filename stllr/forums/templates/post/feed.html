{% load forum_tags %}
<div class="post-feed">

    <div class="feeder post-feeder"
        data-endpoint="{% url 'forums:feed' %}"
        data-page="{{ page.id|default:'' }}"
        data-parent="{{ parent_id|default:'' }}"
        data-author="{{ author|default:'' }}"
        data-seed="{% random_seed %}"
        data-p="1">

        <div class="feeder-dot"></div>

    </div>

</div>
