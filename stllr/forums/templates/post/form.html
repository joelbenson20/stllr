{% load markdown_deux_tags %}

{% if user.is_authenticated %}

    <!-- Done by Claude, requires review -->
    <form {% if parent %}id="replyForm{{ parent.id }}"{% endif %}
        class="{% if parent %}reply-form collapse mt-3 ms-4{% else %}post-form{% endif %} glow-on-focus rounded-card bg-white"
        method="post"
        data-endpoint="{% url 'api:create_post' %}">
        {% csrf_token %}

        <!-- Hidden Fields -->
        <input type="hidden" name="page" value="{{ page.id }}">
        <!-- Done by Claude, requires review -->
        <input type="hidden" name="parent" value="{{ parent.id|default:'' }}">

        <!-- Input -->
        <textarea class="form-control rounded-card border-0 shadow-none p-3"
            name = "content"
            placeholder="What's written in the stars?"
            required></textarea>

        <!-- Markdown preview -->
        <div class="markdown-preview rounded p-3"></div>

        <!-- Buttons -->
        <div class="d-flex align-items-center">

            <button class="btn btn-transparent btn-light rounded-circle m-1"
                type="button">
                <i class="bi bi-question-circle"></i>
            </button>

            <button class="markdown-preview-button btn btn-transparent btn-light rounded-card m-1"
                data-endpoint="{% url 'api:markdownify' %}">
                <i class="bi bi-eye-fill"></i> Preview
            </button>

            <button class="markdown-edit-button btn btn-transparent btn-light rounded-card m-1"
                type="button">
                <i class="bi bi-eye-slash"></i> Edit
            </button>

            <button class="btn btn-light rounded-card ms-auto m-1"
                type="submit">
                {% if parent %}Reply{% else %}Post{% endif %}
            </button>

        </div>

    </form>

{% else %}
    <p class="rounded-pill bg-light text-dark ps-3 py-2">
        Please <a href="{% url "account_login" %}">sign in</a> to post to this forum.
    </p>
{% endif %}
