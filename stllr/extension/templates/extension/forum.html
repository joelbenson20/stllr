{% extends "extension/base.html" %}
{% load static %}


{% block content %}


    {% include "post/form.html" with parent=None %}

    <div id="postFeed">
        {% for post in page.posts.all %}
                {% if post.thread_level == 0 %}
                    {% include "post/card.html" %}
                {% endif %}
            {% endfor %}
    </div>

    <div style="height:144px;"></div>

{% endblock content %}
