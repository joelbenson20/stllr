<base href="{{ request.scheme }}://{{ request.get_host }}/">
{% load static %}

<div id="extensionBody" class="d-flex flex-column vh-100">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/users.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/stars.css' %}">
    <link rel="stylesheet" href="{% static 'css/forums.css' %}">
    <link rel="stylesheet" href="{% static 'css/rooms.css' %}">

    <div class="sticky-top glass">

        <div id="stllr-data" style="display:none"
            data-page-id="{{ page.id }}"
            data-page-canonical="{{ page.canonical }}"
            data-csrf="{{ csrf_token }}">
        </div>

        <div class="px-3">

            {% include "page/card.html" with compact=True extension_header_card=True %}

        </div>
        
    </div>

    <div id="alertContainer" class="m-0 p-0">
        {% for message in messages %}
        <div class="alert {{ message.tags }} alert-dismissible fade show m-3 p-4" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>

    <div class="container-fluid p-3 flex-grow-1 {% block content_wrapper_class %}overflow-y-auto{% endblock %}">
        {% block content %}
        {% endblock content %}
    </div>

    {% include "modals/share.html" %}
    {% include "modals/markdown_help.html" %}
</div>
