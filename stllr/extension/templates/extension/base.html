{% load static %}


<div id="extensionBody">

    <div class="glass sticky-top">

        <div class="extension-header p-3">
            {% include "page/card.html" with compact=True %}
        </div>

        <nav id="extensionNavbar" class="navbar navbar-expand navbar-dark m-0 p-0">
            <button id="refreshButton" class="btn btn-sm btn-transparent btn-dark rounded-circle ms-3" role="button">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <ul class="navbar-nav d-flex align-items-center w-100 justify-content-evenly">
                <li class="nav-item">
                    <a id="forumLink" class="nav-link text-light {% if section == "forum" %}border-bottom{% endif %}" role="button">Forum</a>
                </li>
                <li class="nav-item">
                    <a id="relayLink" class="nav-link text-light {% if section == "relay" %}border-bottom{% endif %}" role="button">Relay</a>
                </li>
                <li class="nav-item">
                    <a id="similarLink" class="nav-link text-light {% if section == "similar" %}border-bottom{% endif %}" role="button">Similar</a>
                </li>
            </ul>
        </nav>

    </div>

    <div class="container-fluid p-3">
        {% block content %}
        {% endblock content %}
    </div>
</div>
