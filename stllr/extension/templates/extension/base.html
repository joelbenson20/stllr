{% load static %}

<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/pages.css' %}">
<link rel="stylesheet" href="{% static 'css/comments.css' %}">

<div class="container-fluid">
    <nav class="navbar navbar-expand navbar-dark sticky-top flex-wrap">
        <p class="text-secondary small w-100 text-truncate mb-0">{{ page.link }}</p>
        <ul class="navbar-nav align-items-center">
            <li id="refreshButton" class="nav-item">
                <a class="btn btn-dark btn-sm rounded-circle" href="#" role="button">
                    <i class="bi bi-arrow-clockwise"></i>
                </a>
            </li>
            <li class="nav-item">
                <a id="pageInfoLink" class="nav-link {% if section == "pageInfo" %}active{% endif %}" role="button">Page Info</a>
            </li>
            <li class="nav-item">
                <a id="forumLink" class="nav-link {% if section == "forum" %}active{% endif %}" role="button">Forum</a>
            </li>
            <li class="nav-item">
                <a id="chatLink" class="nav-link {% if section == "chat" %}active{% endif %}" role="button">Chat</a>
            </li>
        </ul>
    </nav>
    
    {% block content %}
    {% endblock content %}

</div>
