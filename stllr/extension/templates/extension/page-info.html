{% extends "extension/base.html" %}

{% block content %}

    {% include "page/card.html" %}

    {% if similar_pages %}
        <div class="row p-3">
            <h2 class="mt-4">Similar Pages</h2>
            {% for page in similar_pages %}
                {% include 'page/card.html' with page=page user=user %}
            {% endfor %}
        </div>
    {% endif %}

{% endblock content %}
