{% extends "base.html" %}
{% load static %}

{% block title %}explore - stllr{% endblock title %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.querySelector('input[name="query"]');
        if (input) { var v = input.value; input.value = ''; input.value = v; }
    });
</script>
{% endblock scripts %}

{% block content %}

    <form class="d-flex w-100 mb-3" action="{% url 'explore' %}" role="search">
        <input class="search-bar glow-on-focus form-control form-control-lg rounded-pill border-0"
            name="query"
            type="search"
            placeholder="Where to?"
            aria-label="Search"
            value="{{ query|default:'' }}"
            autocomplete="off"
            autofocus>
    </form>

    <div class="d-flex justify-content-end align-items-center gap-2 mb-2">
        <i class="small"> sort:</i>
        <div class="dropdown">
            <button class="btn btn-sm btn-glass rounded-pill dropdown-toggle" id="sortMenuButton" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                {{ sort|capfirst }}
            </button>
            <div class="dropdown-menu dropdown-menu-glass" aria-labelledby="sortMenuButton">
                <a class="dropdown-item" href="{% url 'explore' %}?{% if query %}query={{ query }}&{% endif %}sort=firmament">Firmament</a>
                <a class="dropdown-item" href="{% url 'explore' %}?{% if query %}query={{ query }}&{% endif %}sort=brightest">Brightest</a>
                <a class="dropdown-item" href="{% url 'explore' %}?{% if query %}query={{ query }}&{% endif %}sort=rising">Rising</a>
            </div>
        </div>
    </div>

    {% include "page/feed.html" with query=query sort=sort %}

{% endblock content %}
