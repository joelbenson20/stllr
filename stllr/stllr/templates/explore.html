{% extends "base.html" %}
{% load static %}

{% block title %}explore - stllr{% endblock title %}

{% block content %}

    <form class="d-flex w-100 mb-3" action="{% url 'explore' %}" role="search">
        <input class="search-bar glow-on-focus form-control form-control-lg rounded-pill border-0"
            name="query"
            type="search"
            placeholder="Where to?"
            aria-label="Search"
            value="{{ query|default:'' }}"
            autocomplete="off">
    </form>

    <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-light dropdown-toggle" id="sortMenuButton" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                {{ sort|capfirst }}
            </button>
            <div class="dropdown-menu" aria-labelledby="sortMenuButton">
                <a class="dropdown-item" href="{% url 'explore' %}?{% if query %}query={{ query }}&{% endif %}sort=firmament">Firmament</a>
                <a class="dropdown-item" href="{% url 'explore' %}?{% if query %}query={{ query }}&{% endif %}sort=brightest">Brightest</a>
                <a class="dropdown-item" href="{% url 'explore' %}?{% if query %}query={{ query }}&{% endif %}sort=rising">Rising</a>
            </div>
        </div>
        {% if query %}
            <span class="text-secondary"><i class="bi bi-search"></i> {{ query }}</span>
        {% endif %}
    </div>

    <div class="mt-5" id="pageFeed">
        <div id="pageFeeder" data-url="{% url 'pages:feed' %}"><div class="feeder-dot"></div></div>
    </div>


{% endblock content %}
