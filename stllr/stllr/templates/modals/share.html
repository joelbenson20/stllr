{% if user.is_authenticated %}
<div id="shareModal" class="modal modal-glass fade" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true"
    data-endpoint="{% url 'comms:share_object' %}"
    data-csrf-token="{{ csrf_token }}">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass border border-grid">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="shareModalLabel">Share page</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {% if contacts_list %}
                    <div class="d-flex flex-column gap-2">
                        {% for contact in contacts_list %}
                            <button class="share-contact-btn btn btn-glass border border-grid text-start d-flex align-items-center gap-2 w-100"
                                data-contact-id="{{ contact.id }}"
                                data-username="{{ contact.username }}">
                                {% include "user/avatar.html" with user=contact size="32" dimensions="32x32" %}
                                <span>@{{ contact.username }}</span>
                                <span class="share-btn-status ms-auto"></span>
                            </button>
                        {% endfor %}
                    </div>
                {% else %}
                    <p class="text-secondary mb-0">You have no contacts to share with.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endif %}
