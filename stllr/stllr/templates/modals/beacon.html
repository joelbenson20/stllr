{% if user.is_authenticated %}
<div id="beaconModal" class="modal modal-glass fade" tabindex="-1" aria-labelledby="beaconModalLabel" aria-hidden="true"
    data-create-endpoint="{% url 'beacons:create_beacon' %}"
    data-delete-endpoint="{% url 'beacons:delete_beacon' %}"
    data-status-endpoint="{% url 'beacons:beacon_status' %}"
    data-csrf-token="{{ csrf_token }}">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass rounded-card">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="beaconModalLabel">Select crews</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {% if crews_list %}
                    <div class="d-flex flex-column gap-2">
                        {% for crew in crews_list %}
                            <button class="beacon-crew-btn btn btn-glass text-start d-flex align-items-center gap-2 w-100"
                                data-crew-id="{{ crew.id }}"
                                data-handle="{{ crew.handle }}">
                                {% include "crew/avatar.html" with crew=crew size="32" dimensions="32x32" %}
                                <span>@{{ crew.handle }}</span>
                                <span class="beacon-btn-status ms-auto"></span>
                            </button>
                        {% endfor %}
                    </div>
                {% else %}
                    <p class="text-secondary mb-0">You are not a member of any crews.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endif %}
