{% if requests_received %}
    <h6 class="text-uppercase small fw-bold text-secondary mb-2">Requests</h6>
    {% for rel in requests_received %}
        <div class="d-flex align-items-center glass-no-blur rounded-card gap-3 py-2 px-2 mb-2">
            <a href="{% url 'users:profile' rel.from_user.username %}" class="d-flex align-items-center gap-3 text-decoration-none flex-grow-1">
                {% include "user/avatar.html" with user=rel.from_user size="40" dimensions="40x40" %}
                <span class="fw-semibold">@{{ rel.from_user.username }}</span>
            </a>
            {% include "contact/buttons/response.html" with other=rel.from_user %}
        </div>
    {% endfor %}
{% endif %}
