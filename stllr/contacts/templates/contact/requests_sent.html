{% if requests_sent %}
    <h6 class="text-uppercase small fw-bold text-secondary mb-2">Pending</h6>
    {% for rel in requests_sent %}
        <div class="d-flex align-items-center glass-no-blur rounded-card gap-3 py-2 px-2 mb-2">
            <a href="{% url 'users:profile' rel.to_user.username %}" class="d-flex align-items-center gap-3 text-decoration-none flex-grow-1">
                {% include "user/avatar.html" with user=rel.to_user size="40" dimensions="40x40" %}
                <span class="fw-semibold">@{{ rel.to_user.username }}</span>
            </a>
            <form method="post" action="{% url 'contacts:remove_contact' rel.to_user.username %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <button type="submit" class="btn btn-sm btn-glass">Cancel</button>
            </form>
        </div>
    {% endfor %}
{% endif %}
