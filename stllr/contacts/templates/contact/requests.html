{% if requests_list %}
    <h6 class="text-uppercase small fw-bold text-secondary mb-2">Requests</h6>
    {% for rel in requests_list %}
        <div class="d-flex align-items-center gap-2 mb-2">
            <a href="{% url 'users:profile' rel.from_user.username %}" class="d-flex align-items-center gap-2 text-light text-decoration-none flex-grow-1 text-truncate">
                {% include "user/avatar.html" with user=rel.from_user size="28" dimensions="28x28" %}
                <span class="small text-truncate">@{{ rel.from_user.username }}</span>
            </a>
            {% include "contact/status_button.html" with other=rel.from_user contact=rel %}
        </div>
    {% endfor %}
{% endif %}
