{% extends "base.html" %}
{% load static %}

{% block title %}contacts - stllr{% endblock title %}

{% block content %}

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
            <h4 class="fw-bold mb-0">Contacts</h4>
            <a href="{% url 'contacts:find_contacts' %}" class="btn btn-glass rounded-circle d-flex align-items-center justify-content-center" style="width:31px;height:31px;">
                <i class="bi bi-plus"></i>
            </a>
        </div>
        <div class="dropdown">
            <button class="btn btn-glass btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                Invite a friend
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-glass">
                <li>
                    <a class="dropdown-item" href="mailto:?subject=Get on Stllr!&body=Hey! I wanna travel the World Wide Web with you on Stllr! Where you at?!: https://stllr.io">
                        <i class="bi bi-envelope me-2"></i>Email
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" href="sms:?&body=Hey! I wanna travel the World Wide Web with you on Stllr! Where you at?!: https://stllr.io">
                        <i class="bi bi-chat-dots me-2"></i>Text
                    </a>
                </li>
            </ul>
        </div>
    </div>

    {% include "contact/list.html" %}

{% endblock content %}
