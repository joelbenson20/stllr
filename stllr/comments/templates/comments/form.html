{% load markdown_deux_tags %}

{% if user.is_authenticated %}
    <form id="comment-form-{{ parent.id }}"
        class="comment-form rounded mt-3" method="post" action="{% url "comments:post" %}">
        {% csrf_token %}
        <input type="hidden" name="parent" value="{{ parent.id|default:'' }}">
        <input type="hidden" name="page" value="{{ page.id }}">
        <textarea class="comment-form-textarea form-control border-0 rounded shadow-none"
            name = "content"
            placeholder="Reach for the stars..."
            required></textarea>
        <div class="comment-form-markdown-preview-container border rounded p-2">
        </div>
        <div class="comment-form-buttons d-flex align-items-center">
            <button type="button" class="comment-form-markdown-preview-button btn btn-transparent btn-light rounded m-1">
                <i class="bi bi-eye-fill"></i> Preview
            </button>
            <button type="button" class="comment-form-markdown-edit-button btn btn-transparent btn-light rounded m-1">
                <i class="bi bi-eye-slash"></i> Edit
            </button>
            {% comment %} <button type="button" class="comment-cancel-button btn btn-transparent btn-light rounded ms-auto m-1">
                Cancel
            </button> {% endcomment %}
            <button type="submit" class="comment-submit-button btn btn-light rounded ms-auto m-1">
                Comment
            </button>
        </div>
    </form>
{% else %}
    <p class="rounded-pill bg-light text-dark ps-3 py-2">Sign in to enter the forum.</p>
{% endif %}
