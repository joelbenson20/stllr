<button class="float-button display-6 text-nowrap m-0 p-0"
    data-webpage-id="{{ webpage.id }}"
    data-csrf-token="{{ csrf_token }}"
    {% if webpage.id in user.voted_webpages_ids %}
        data-voted="true"
    {% else %}
        data-voted="false"
    {% endif %}
    {% if not user.is_authenticated %}
        disabled
    {% endif %}
    >
    <span class="float-count small">{{ webpage.num_votes }}</span>
    <i class="bi bi-sunrise"></i>
</button>
