services:

  db:
    image: postgres:17
    restart: always
    volumes:
      - ./data/db_prod:/var/lib/postgresql/data
    env_file:
      - ./stllr/.env.prod

  cache:
    image: redis:8
    restart: always
    volumes:
      - ./data/cache_prod:/data

  web:
    build: .
    # Done by Claude, requires review
    command:
      - ./wait-for-it.sh
      - db:5432
      - "--"
      - bash
      - -c
      - |
        cd /code/stllr
        python manage.py collectstatic --noinput
        python manage.py migrate
        mkdir -p /code/media/prod
        chown -R www-data:www-data /code/media
        chown www-data:www-data /code/stllr
        uwsgi --ini /code/config/uwsgi/uwsgi.ini
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    depends_on:
      - db
      - cache

  celery:
    build: .
    command: ["./wait-for-it.sh", "db:5432", "--",
              "bash", "-c", "cd /code/stllr && celery -A stllr worker --loglevel=info"]
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    depends_on:
      - db
      - cache

  celery-beat:
    build: .
    command: ["./wait-for-it.sh", "db:5432", "--",
              "bash", "-c", "cd /code/stllr && celery -A stllr beat --loglevel=info"]
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    depends_on:
      - db
      - cache

  nginx:
    image: nginx:1.28
    restart: always
    volumes:
      - ./config/nginx:/etc/nginx/templates
      - .:/code
    ports:
      - "80:80"
      - "443:443"
