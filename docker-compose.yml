services:

  db:
    image: postgres:17
    restart: always
    volumes:
      - ./data/db_prod:/var/lib/postgresql/data
    env_file:
      - ./stllr/.env.prod

  cache:
    image: redis:8
    restart: always
    command: redis-server --save "" --appendonly no
    user: "999:999"
    volumes:
      - cache_prod:/data

  web:
    build: .
    command:
      - ./wait-for-it.sh
      - db:5432
      - "--"
      - bash
      - -c
      - |
        cd /code/stllr
        python manage.py collectstatic --noinput
        python manage.py migrate
        mkdir -p /code/stllr/media/prod
        chown -R www-data:www-data /code/stllr/media
        uwsgi --ini /code/config/uwsgi/uwsgi.ini
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    depends_on:
      - db
      - cache

  daphne:
    build: .
    working_dir: /code/stllr
    command:
      - ../wait-for-it.sh
      - db:5432
      - "--"
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "9001"
      - stllr.asgi:application
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    depends_on:
      - db
      - cache

  nginx:
    image: nginx:1.28
    restart: always
    volumes:
      # mount file directly to bypass envsubst template processing
      - ./config/nginx/default.conf.template:/etc/nginx/conf.d/default.conf:ro
      - .:/code
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - daphne
      - web

  celery:
    build: .
    command: ["./wait-for-it.sh", "db:5432", "--",
              "bash", "-c", "cd /code/stllr && celery -A stllr worker --loglevel=info"]
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    environment:
      - REDIS_URL=redis://cache:6379
      - CELERY_BROKER_URL=redis://cache:6379/0
      - CELERY_RESULT_BACKEND=redis://cache:6379/0
      - POSTGRES_HOST=db
    depends_on:
      - db
      - cache

  celery-beat:
    build: .
    command: ["./wait-for-it.sh", "db:5432", "--",
              "bash", "-c", "cd /code/stllr && celery -A stllr beat --loglevel=info"]
    restart: always
    volumes:
      - .:/code
    env_file:
      - ./stllr/.env.prod
    environment:
      - REDIS_URL=redis://cache:6379
      - CELERY_BROKER_URL=redis://cache:6379/0
      - CELERY_RESULT_BACKEND=redis://cache:6379/0
      - POSTGRES_HOST=db
    depends_on:
      - db
      - cache

volumes:
  cache_prod:
