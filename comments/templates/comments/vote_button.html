<a id="comment-star-button-{{ comment.id }}" class="comment-star-button btn btn-xs btn-dark"
    href="#"
    data-id={{ comment.id }}
    data-action="{% if comment in user.comments_starred.all %}un{% endif %}star"
    data-csrf-token={{ csrf_token }}>
    <span class="star-count">{{ comment.total_stars }}</span>
    <i class="bi {% if comment in user.comments_starred.all %}bi-star-fill{% else %}bi-star{% endif %}"></i>
</a>
