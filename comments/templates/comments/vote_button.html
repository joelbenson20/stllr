<a id="comment-vote-button-{{ comment.id }}" class="comment-vote-button btn btn-sm btn-dark"
    href="#"
    data-id={{ comment.id }}
    data-action="{% if comment.id in user.voted_comments_ids %}un{% endif %}vote"
    data-csrf-token={{ csrf_token }}>
    <span class="vote-count">{{ comment.num_votes }}</span>
    <i class="bi {% if comment.id in user.voted_comments_ids %}bi-star-fill{% else %}bi-star{% endif %}"></i>
</a>
